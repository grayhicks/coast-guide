    </linearGradient>
    <filter id="pa_paper_ia" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.30" numOctaves="3" seed="7" result="tooth"/>
      <feDiffuseLighting in="tooth" lighting-color="#FAF1DD" surfaceScale="0.6" diffuseConstant="1.05" result="lit">
        <feDistantLight azimuth="225" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="lit" mode="multiply" result="paper"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.6" numOctaves="1" seed="12" result="laid"/>
      <feColorMatrix in="laid" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.2  0.11 0 0 0 -0.045" result="fib"/>
      <feComposite in="fib" in2="paper" operator="over"/>

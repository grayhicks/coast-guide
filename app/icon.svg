    <filter id="pa_mott_ia" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="31" result="cloud"/>
      <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.43  0 0 0 0 0.25  0.04 0 0 0 0" result="cl"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="2" seed="23" result="stain"/>
      <feColorMatrix in="stain" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0 0.18  0.018 0 0 0 -0.008" result="st"/>
      <feMerge><feMergeNode in="cl"/><feMergeNode in="st"/></feMerge>
    </filter>
    <filter id="pa_lift_ia" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="5" dy="7" stdDeviation="7" flood-color="#3A2408" flood-opacity="0.34"/>
    </filter>

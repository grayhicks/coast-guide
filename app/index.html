/* Registration is guarded three ways: the API may not exist, the page may be opened from file://
   where registration throws, and a failure must never take the app down with it. The app works
   perfectly without a service worker — this only makes a later visit open on the current build
   instead of whatever was cached last, with no signal required. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    /* ⛔⛔ 08/26 — THIS PATH HAD NO GUARD AT ALL AND THAT IS THE GLITCH GRAY SAW ON HIS WIFE'S
       PHONE. "on first login her first few cards were glitching. They did NOT show the more info
       and maps buttons. And they showed half of the animation and color scheme. So I scrolled up
       and then the coastal Eventures went away and I clicked on it. And it brought it back."
       Every symptom in that sentence is one page being torn down while it is still painting.
       HER EXACT CONDITIONS: the app was installed on a cached build, so hadController was TRUE, a
       newer sw.js landed on open, clients.claim() flipped control, controllerchange fired — and
       this handler called location.reload() immediately, whatever the app was doing. Cards half
       built, the masthead not yet painted, a tap forcing the repaint that "brought it back".
       ⛔ THE VERSION PROBE FIFTY LINES BELOW ALREADY KNOWS BETTER. It waits on touched, checks
       visibilityState, keeps a per-version session mark and falls back to the update BAR — under a
       comment that says NEVER YANK THE PAGE OUT FROM UNDER HIM. Two paths can reload this app and
       only one of them had the discipline. Same rules here now:
         - not before the app has actually painted (one frame past the load event),
         - not if the reader has already touched anything,
         - not if the tab is in the background,
         - and when it refuses, it raises the same update bar rather than sitting silent on a build
           we already know is stale.
       ⚠ touched is declared below this handler and read inside it, which is fine — the listener
       cannot run before the current script finishes. */
    /* hoisted above BOTH reload paths, because both of them now read it. */
    var touched = false;
    ["pointerdown", "keydown", "wheel", "scroll"].forEach(function (t) {
      window.addEventListener(t, function () { touched = true; }, { once: true, passive: true });
    });
    var painted = false;
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () { painted = true; });
    });
    function offerUpdate() {
      try {
        window.__GCA_UPDATE_READY = window.__GCA_UPDATE_READY || "sw";
        window.dispatchEvent(new CustomEvent("gca:update", { detail: { version: "sw" } }));
      } catch (err) {}
    }
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloaded) return;
      if (!painted || touched || document.visibilityState !== "visible") { offerUpdate(); return; }
      reloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
      /* update() returns its own promise; a transient network blip must not surface as an
         unhandled rejection, so it is caught here rather than only guarding the sync call. A
         failed check here just means this open still shows the current cache — no worse than
         before this fix — and the NEXT open tries again. */
      reg.update().catch(function () {});
    }).catch(function () {});

    /* ⭐ THE FRESHNESS PROBE. version.txt is sixteen hex characters; it arrives on any link a
       phone has, where the 4.6MB document does not. Only a MISMATCH costs anything. */
    var build = window.__GCA_BUILD;
    fetch("./version.txt", { cache: "no-store" }).then(function (r) {
      return r && r.ok ? r.text() : null;
    }).then(function (v) {
      if (!v || !build || v.trim() === build) return;
      /* ⚠ ONE AUTO-RELOAD PER BUILD PER TAB, and the key is the TARGET version. If anything ever
         went wrong downstream — a put that did not take, a cache the next worker's activate
         deleted underneath us — this is what stops a reload loop instead of a comment promising
         one cannot happen. A second attempt costs the user nothing; a loop costs them the app. */
      var mark = "gca_rl_" + v.trim();
      try { if (sessionStorage.getItem(mark)) return; } catch (err) {}
      navigator.serviceWorker.ready.then(function (reg2) {
        var worker = reg2.active;
        if (!worker) return;
        navigator.serviceWorker.addEventListener("message", function onMsg(ev) {
          if (!ev.data || ev.data.gca !== "fresh") return;
          navigator.serviceWorker.removeEventListener("message", onMsg);
          /* ⛔ NEVER YANK THE PAGE OUT FROM UNDER HIM. If he has already scrolled, tapped or
             switched away, the cache is warm and the NEXT open is current on its own — which is
             the behaviour before this fix, so waiting costs nothing and reloading mid-read costs
             his place. The reload is for the case it is meant for: the app just opened, he has
             not touched it, and a newer build is sitting in the cache. */
          if (touched || document.visibilityState !== "visible") {
            /* ⭐ 08/21 — GCA-058. This is the ONE case the silent path deliberately refuses, and
               until now it refused in silence: the reader has scrolled or tapped, so reloading
               would cost them their place, and they were left sitting on a build we already know
               is old with no way to act on it. Gray asked "How do I get it to auto update?" —
               this is the half of the answer that was missing. The app renders the bar; the shell
               only states the fact, so a build with no service worker (the offline artifact,
               a file:// open) simply never sees it. */
            try {
              window.__GCA_UPDATE_READY = v.trim();
              window.dispatchEvent(new CustomEvent("gca:update", { detail: { version: v.trim() } }));
            } catch (err) {}
            return;
          }
          try { sessionStorage.setItem(mark, "1"); } catch (err) {}
          location.reload();
        });
        worker.postMessage({ gca: "refresh" });
      }).catch(function () {});
    }).catch(function () {});

# Publishes publish/ to GitHub Pages.
#
# WHY THIS FILE EXISTS: the sandbox that builds this repo cannot reach the GitHub API
# (api.github.com/repos/... is blocked through its proxy), so it cannot switch Pages on.
# configure-pages CAN, because it runs on GitHub's own side with the workflow's token.
# enablement: true means the FIRST run of this workflow turns Pages on by itself —
# no Settings click required.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
